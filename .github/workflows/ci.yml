name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  # CI uses a throwaway Postgres; production uses Supabase (see README).
  DATABASE_URL: postgresql://fish:fish@localhost:5432/fishparadise
  DIRECT_URL: postgresql://fish:fish@localhost:5432/fishparadise
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else
  OTP_PROVIDER: console
  PAYMENT_PROVIDER: fake
  NOTIFY_PROVIDER: console

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fish
          POSTGRES_PASSWORD: fish
          POSTGRES_DB: fishparadise
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fish" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm exec vitest run --config vitest.integration.config.mts
      # Pages are prerendered from the catalogue, so the build needs the seeded database.
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fish
          POSTGRES_PASSWORD: fish
          POSTGRES_DB: fishparadise
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fish" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      # The dev server is used so the console OTP code and the fake payment gateway are available.
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
